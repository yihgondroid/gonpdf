appId: com.pdfeditor.app
productName: PDF 편집 툴
copyright: Copyright © 2026

asar: true
asarUnpack:
  - "node_modules/pdfjs-dist/build/pdf.worker.js"
  - "node_modules/pdfjs-dist/cmaps/**"
  - "node_modules/pdfjs-dist/standard_fonts/**"

directories:
  output: dist

win:
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: []
  sign: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: LICENSES.txt

files:
  - main.js
  - preload.js
  - renderer/**
  - "!renderer/js/**/*.test.js"
  - node_modules/**
  - "!node_modules/.cache/**"
  - LICENSE
  - LICENSES.txt

extraResources:
  - from: node_modules/tesseract.js/
    to: tesseract/
    filter: ["**/*"]

publish:
  provider: github
  owner: yihgondroid
  repo: gonpdf
  releaseType: release
